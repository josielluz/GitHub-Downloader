name: 🐙 Baixar Repositórios GitHub

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:

  download-repositories:

    name: 📦 Baixar repositórios

    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # 1. Checkout
      # ======================================================

      - name: 📥 Checkout
        uses: actions/checkout@v4

      # ======================================================
      # 2. Python
      # ======================================================

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ======================================================
      # 3. Verificar ambiente
      # ======================================================

      - name: 🔧 Verificar ambiente
        run: |
          echo "Python:"
          python --version

          echo
          echo "Git:"
          git --version

      # ======================================================
      # 4. Verificar Secret
      # ======================================================

      - name: 🔐 Verificar GITHUB_TOKEN
        env:
          GITHUB_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}
        run: |
          if [ -z "$GITHUB_TOKEN" ]; then
            echo "❌ ERRO: MY_GITHUB_TOKEN não foi encontrado."
            echo
            echo "Verifique:"
            echo "1. Settings"
            echo "2. Secrets and variables"
            echo "3. Actions"
            echo "4. Repository secrets"
            echo "5. O Secret deve se chamar exatamente:"
            echo "   MY_GITHUB_TOKEN"
            exit 1
          fi

          echo "✅ MY_GITHUB_TOKEN encontrado."
          echo "🔐 Token não será exibido."

      # ======================================================
      # 5. Baixar repositórios
      # ======================================================

      - name: 📦 Baixar repositórios
        env:
          GITHUB_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}
        run: |
          python github_bulk_downloader.py \
            --mine \
            --output github_repos \
            --skip-archived

      # ======================================================
      # 6. Verificar resultado
      # ======================================================

      - name: 🔎 Verificar downloads
        run: |
          if [ ! -d "github_repos" ]; then
            echo "❌ Pasta github_repos não encontrada."
            exit 1
          fi

          echo "✅ Pasta github_repos criada."

          echo
          echo "📁 Repositórios encontrados:"
          find github_repos -mindepth 1 -maxdepth 1 -type d | sort

      # ======================================================
      # 7. Compactar
      # ======================================================

      - name: 📦 Compactar repositórios
        run: |
          if [ -d "github_repos" ]; then
            zip -r github_repos.zip github_repos
          else
            echo "❌ Pasta github_repos não encontrada."
            exit 1
          fi

      # ======================================================
      # 8. Upload do ZIP
      # ======================================================

      - name: ⬆️ Upload dos repositórios
        uses: actions/upload-artifact@v4
        with:
          name: github-repositories
          path: github_repos.zip
          if-no-files-found: error
          retention-days: 7
